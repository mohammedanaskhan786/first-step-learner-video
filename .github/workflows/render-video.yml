name: First Step Learner - 60 Minute Animated Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Remotion project
        shell: bash
        run: |
          set -e

          rm -rf src public package.json tsconfig.json remotion.config.ts
          mkdir -p src public

          cat > package.json <<'EOF'
          {
            "name": "first-step-learner-60m",
            "private": true,
            "scripts": {
              "render": "remotion render src/index.ts FirstStepLearner60 out/first-step-learner.mp4 --gl=swangle"
            },
            "dependencies": {
              "@remotion/cli": "4.0.0",
              "react": "18.3.1",
              "react-dom": "18.3.1",
              "remotion": "4.0.0",
              "typescript": "5.6.3"
            }
          }
          EOF

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "lib": ["ES2022", "DOM"],
              "jsx": "react-jsx",
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "strict": true,
              "skipLibCheck": true,
              "esModuleInterop": true
            },
            "include": ["src"]
          }
          EOF

          cat > remotion.config.ts <<'EOF'
          import { Config } from "@remotion/cli/config";

          Config.setOverwriteOutput(true);
          Config.setVideoImageFormat("jpeg");
          EOF

          cat > src/index.ts <<'EOF'
          import { registerRoot } from "remotion";
          import { RemotionRoot } from "./Root";

          registerRoot(RemotionRoot);
          EOF

          cat > src/Root.tsx <<'EOF'
          import React from "react";
          import { Composition } from "remotion";
          import { FirstStepLearner } from "./FirstStepLearner";

          export const RemotionRoot: React.FC = () => {
            return (
              <Composition
                id="FirstStepLearner60"
                component={FirstStepLearner}
                durationInFrames={60 * 60 * 30}
                fps={30}
                width={1920}
                height={1080}
              />
            );
          };
          EOF

          cat > src/FirstStepLearner.tsx <<'EOF'
          import React from "react";
          import {
            AbsoluteFill,
            interpolate,
            useCurrentFrame,
            useVideoConfig,
          } from "remotion";

          const chapters = [
            "AI PROMPTING",
            "AI IS NOT A MIND READER",
            "WEAK PROMPTS",
            "THE 4-BLOCK FRAMEWORK",
            "BETTER INSTRUCTIONS",
            "REAL-WORLD USE",
            "EMAIL WRITING",
            "STUDY WITH AI",
            "CONTENT CREATION",
            "RESEARCH",
            "CONTEXT",
            "CONSTRAINTS",
            "COMMON MISTAKES",
            "ITERATION",
            "AI AS AN ASSISTANT",
            "THREE LEVELS OF PROMPTING",
            "FINAL CHALLENGE",
            "WRAP UP"
          ];

          const colors = [
            "#7c3aed",
            "#9333ea",
            "#a855f7",
            "#6d28d9"
          ];

          export const FirstStepLearner: React.FC = () => {
            const frame = useCurrentFrame();
            const { fps, durationInFrames } = useVideoConfig();

            const progress = frame / durationInFrames;
            const chapterIndex = Math.min(
              chapters.length - 1,
              Math.floor(progress * chapters.length)
            );

            const chapter = chapters[chapterIndex];

            const pulse =
              1 + Math.sin(frame / 14) * 0.035;

            const rotation =
              frame * 0.18;

            const opacity = interpolate(
              frame % (fps * 2),
              [0, fps * 0.5, fps * 1.5, fps * 2],
              [0.25, 1, 1, 0.25]
            );

            return (
              <AbsoluteFill
                style={{
                  background:
                    "radial-gradient(circle at center, #160d24 0%, #08050d 45%, #020204 100%)",
                  color: "white",
                  fontFamily:
                    "Arial, Helvetica, sans-serif",
                  overflow: "hidden"
                }}
              >

                {/* Animated futuristic grid */}
                <div
                  style={{
                    position: "absolute",
                    inset: -300,
                    opacity: 0.18,
                    backgroundImage:
                      "linear-gradient(rgba(168,85,247,.25) 1px, transparent 1px), linear-gradient(90deg, rgba(168,85,247,.25) 1px, transparent 1px)",
                    backgroundSize: "80px 80px",
                    transform:
                      `perspective(800px) rotateX(65deg) translateY(${(frame % 200) - 100}px)`
                  }}
                />

                {/* Floating particles */}
                {Array.from({ length: 90 }).map((_, i) => {
                  const x =
                    (i * 83 + frame * (0.25 + (i % 3) * 0.08)) % 2000;

                  const y =
                    (i * 47 + Math.sin(frame / 40 + i) * 70) % 1200;

                  const size = 2 + (i % 4);

                  return (
                    <div
                      key={i}
                      style={{
                        position: "absolute",
                        left: x,
                        top: y,
                        width: size,
                        height: size,
                        borderRadius: "50%",
                        background: colors[i % colors.length],
                        opacity: 0.25 + (i % 5) * 0.1,
                        boxShadow: "0 0 14px #a855f7"
                      }}
                    />
                  );
                })}

                {/* Main AI core */}
                <div
                  style={{
                    position: "absolute",
                    left: "50%",
                    top: "48%",
                    width: 360,
                    height: 360,
                    transform:
                      `translate(-50%, -50%) scale(${pulse}) rotate(${rotation}deg)`,
                    borderRadius: "50%",
                    border: "2px solid rgba(168,85,247,.65)",
                    boxShadow:
                      "0 0 45px rgba(168,85,247,.5), inset 0 0 45px rgba(124,58,237,.35)"
                  }}
                >
                  <div
                    style={{
                      position: "absolute",
                      inset: 45,
                      borderRadius: "50%",
                      border:
                        "1px solid rgba(216,180,254,.65)"
                    }}
                  />

                  {Array.from({ length: 12 }).map((_, i) => (
                    <div
                      key={i}
                      style={{
                        position: "absolute",
                        left: "50%",
                        top: "50%",
                        width: 10,
                        height: 10,
                        borderRadius: "50%",
                        background: "#c084fc",
                        transform:
                          `rotate(${i * 30}deg) translateY(-155px)`,
                        boxShadow:
                          "0 0 18px #c084fc"
                      }}
                    />
                  ))}

                  <div
                    style={{
                      position: "absolute",
                      inset: 115,
                      borderRadius: "50%",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      fontSize: 62,
                      fontWeight: 800,
                      background:
                        "radial-gradient(circle, #2e1065, #090312)"
                    }}
                  >
                    AI
                  </div>
                </div>

                {/* Title */}
                <div
                  style={{
                    position: "absolute",
                    top: 85,
                    left: 100,
                    right: 100,
                    textAlign: "center",
                    opacity
                  }}
                >
                  <div
                    style={{
                      fontSize: 25,
                      letterSpacing: 7,
                      opacity: 0.65
                    }}
                  >
                    FIRST STEP LEARNER
                  </div>

                  <div
                    style={{
                      marginTop: 18,
                      fontSize: 58,
                      fontWeight: 800,
                      letterSpacing: 2,
                      textShadow:
                        "0 0 30px rgba(168,85,247,.55)"
                    }}
                  >
                    {chapter}
                  </div>
                </div>

                {/* Prompt → AI → Output */}
                <div
                  style={{
                    position: "absolute",
                    bottom: 95,
                    left: 0,
                    right: 0,
                    display: "flex",
                    justifyContent: "center",
                    alignItems: "center",
                    gap: 30
                  }}
                >
                  {[
                    ["INPUT", "Your Prompt"],
                    ["AI", "Processing"],
                    ["OUTPUT", "Useful Result"]
                  ].map(([label, text], i) => {
                    const local =
                      interpolate(
                        (frame + i * 18) % 90,
                        [0, 25, 70, 90],
                        [0, 1, 1, 0]
                      );

                    return (
                      <React.Fragment key={label}>
                        <div
                          style={{
                            width: 270,
                            minHeight: 120,
                            padding: 25,
                            borderRadius: 22,
                            border:
                              "1px solid rgba(192,132,252,.4)",
                            background:
                              "rgba(20,10,32,.75)",
                            boxShadow:
                              "0 0 30px rgba(124,58,237,.18)",
                            opacity: 0.45 + local * 0.55,
                            transform:
                              `translateY(${(1 - local) * 20}px)`
                          }}
                        >
                          <div
                            style={{
                              fontSize: 17,
                              letterSpacing: 3,
                              opacity: 0.55
                            }}
                          >
                            {label}
                          </div>

                          <div
                            style={{
                              marginTop: 15,
                              fontSize: 24,
                              fontWeight: 700
                            }}
                          >
                            {text}
                          </div>
                        </div>

                        {i < 2 && (
                          <div
                            style={{
                              fontSize: 42,
                              opacity: 0.6
                            }}
                          >
                            →
                          </div>
                        )}
                      </React.Fragment>
                    );
                  })}
                </div>

                {/* Timeline */}
                <div
                  style={{
                    position: "absolute",
                    bottom: 28,
                    left: 100,
                    right: 100,
                    height: 4,
                    background:
                      "rgba(255,255,255,.12)"
                  }}
                >
                  <div
                    style={{
                      width: `${progress * 100}%`,
                      height: "100%",
                      background:
                        "linear-gradient(90deg,#6d28d9,#c084fc)",
                      boxShadow:
                        "0 0 15px #a855f7"
                    }}
                  />
                </div>

              </AbsoluteFill>
            );
          };
          EOF

      - name: Install dependencies
        run: npm install

      - name: Render 60 minute animated MP4
        run: |
          mkdir -p out
          npm run render

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: first-step-learner-60-minute-video
          path: out/first-step-learner.mp4
          retention-days: 7

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-60m-${{ github.run_number }}
          name: First Step Learner - 60 Minute Animated Video #${{ github.run_number }}
          generate_release_notes: true
          files: out/first-step-learner.mp4
