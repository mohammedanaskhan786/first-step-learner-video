name: Render Video

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Ensure Browser
        run: |
          npm install
          npx remotion browser ensure

      - name: Render Video
        run: |
          npx remotion render Remotion/index.ts FirstStepLearner out/video.mp4
          
          
