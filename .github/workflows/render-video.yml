name: Render Video

on:
  workflow_dispatch:
    inputs:
      script_file:
        description: 'Script file name (must be in repo root)'
        required: true
        default: 'script.txt'
      voice:
        description: 'Voice name'
        required: false
        default: 'hi-IN-SwaraNeural'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
           unzip -o First_Step_Learner_60_Minute_Remotion_Project.zip -d extracted_folder
           cp -r extracted_folder/First_Step_Learner_60_Minute_Project/* ./
    
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
           npm install
           npx remotion browser ensure

      - name: Install Python dependencies
        run: pip install pydub mutagen edge-tts

      - name: Install Node dependencies
        working-directory: remotion
        run: |
          npm install
          npx remotion browser ensure

      - name: Generate voice narration
        run: python3 pipeline/hinglish_voice.py --script "${{ github.event.inputs.script_file }}" --out narration.mp3 --voice "${{ github.event.inputs.voice }}"

      - name: Generate timeline
        run: python3 pipeline/generate_timeline.py --script "${{ github.event.inputs.script_file }}" --audio narration.mp3

      - name: Render video
        working-directory: remotion
        run: npx remotion render src/index.ts MainVideo out/first-step-learner.mp4 --codec=h264 --crf=20 --pixel-format=yuv420p --gl=swangle

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_number }}
          name: "Video Render #${{ github.run_number }}"
          files: remotion/out/first-step-learner.mp4
