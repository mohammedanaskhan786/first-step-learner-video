name: Render First Step Learner Video 1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium

      - name: Install Node dependencies
        run: npm install

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate male Hindi voice
        run: python scripts/generate_voice.py

      - name: Render MP4
        run: |
          mkdir -p out
          npm run render

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: first-step-learner-video1
          path: out/first-step-learner.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-1-modular
          name: First Step Learner Video 1 - Modular Render
          files: out/first-step-learner.mp4
          make_latest: true
