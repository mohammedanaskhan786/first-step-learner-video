name: Render First Step Learner Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Render video
        run: npm run build

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: first-step-learner-video
          path: out/video.mp4
          retention-days: 7
