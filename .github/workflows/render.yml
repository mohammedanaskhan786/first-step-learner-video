name: Generate Voice and Render Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Generate English voiceover
        run: |
          python scripts/generate_voice.py

      - name: Install Node dependencies
        run: npm install

      - name: Render Remotion video
        run: npm run build

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: first-step-learner-video
          path: out/video.mp4
          retention-days: 7

      - name: Upload generated narration
        uses: actions/upload-artifact@v4
        with:
          name: narration-mp3
          path: public/audio/narration.mp3
          retention-days: 7
